<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Production Office</title>
    <script src="https://accounts.google.com/gsi/client"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0e1420;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-shell { width: 100%; max-width: 420px; }
        .login-card {
            background: #161d2e;
            border: 1px solid #232c42;
            border-radius: 16px;
            padding: 40px 32px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
        }
        .logo-svg { width: 44px; height: 44px; flex-shrink: 0; }
        .logo-text {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00A99D, #2ecc71);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .app-name {
            font-size: 0.65rem;
            font-weight: 500;
            color: #8993ab;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-left: auto;
        }
        h2 {
            color: #eef2fb;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .subheading {
            color: #8993ab;
            font-size: 0.9rem;
            margin-bottom: 28px;
        }
        .btn-google {
            width: 100%;
            padding: 12px;
            background: #fff;
            color: #1a1a2e;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-google:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(255,255,255,0.1);
        }
        .btn-google svg { width: 20px; height: 20px; }
        .error-msg {
            display: none;
            color: #e74c3c;
            background: rgba(231,76,60,0.1);
            border: 1px solid #e74c3c;
            border-radius: 8px;
            padding: 10px 14px;
            margin-top: 16px;
            font-size: 0.85rem;
        }
        .error-msg.visible { display: block; }
        .footer-note {
            color: #8993ab;
            font-size: 0.7rem;
            text-align: center;
            margin-top: 24px;
        }
        .loading-spinner {
            display: none;
            text-align: center;
            color: #8993ab;
            margin-top: 12px;
            font-size: 0.85rem;
        }
        .loading-spinner.active { display: block; }
        .loading-spinner::after {
            content: '';
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #8993ab;
            border-top: 2px solid #00A99D;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-shell">
        <div class="login-card">
            <div class="logo-area">
                <svg class="logo-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="100" cy="100" r="98" fill="#00A99D"/>
                    <rect x="2" y="58" width="133" height="20" fill="white"/>
                    <rect x="58" y="2" width="20" height="133" fill="white"/>
                    <rect x="65" y="122" width="133" height="20" fill="white"/>
                    <rect x="122" y="65" width="20" height="133" fill="white"/>
                </svg>
                <span class="logo-text">STAIRCRAFT</span>
                <span class="app-name">Production Office</span>
            </div>

            <h2>Welcome back</h2>
            <p class="subheading">Sign in with your Google account to continue</p>

            <button id="googleLoginBtn" class="btn-google">
                <svg viewBox="0 0 48 48">
                    <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
                    <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                    <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                    <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
                </svg>
                Sign in with Google
            </button>

            <div id="loadingMsg" class="loading-spinner">Verifying...</div>
            <div id="errorMsg" class="error-msg"></div>

            <p class="footer-note">🔒 Authorized users only · © 2026 Staircraft</p>
        </div>
    </div>

    <script>
        // ===== CONFIG =====
        const CLIENT_ID = '965947227076-hrls555o1pv7coftc80qng6chgtf0sh7.apps.googleusercontent.com';
        const USER_LIST_SHEET_ID = '1uX_f3jc123mX2SsK7vIVIxN_zpQ3GkUqmA9U0QdJ2Dw';
        const USER_LIST_GID = '0';

        const loginBtn = document.getElementById('googleLoginBtn');
        const errorMsg = document.getElementById('errorMsg');
        const loadingMsg = document.getElementById('loadingMsg');

        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.classList.add('visible');
            loadingMsg.classList.remove('active');
            loginBtn.disabled = false;
        }
        function showLoading() {
            loadingMsg.classList.add('active');
            errorMsg.classList.remove('visible');
            loginBtn.disabled = true;
        }

        // Fetch user list from Google Sheets
        async function fetchUserList() {
            const url = `https://docs.google.com/spreadsheets/d/${USER_LIST_SHEET_ID}/gviz/tq?tqx=out:json&gid=${USER_LIST_GID}`;
            const response = await fetch(url);
            const text = await response.text();
            const json = JSON.parse(text.substring(47, text.length - 2));
            const rows = json.table.rows;
            const users = [];
            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                if (!row.c || row.c.length < 4) continue;
                const name = row.c[0]?.v || '';
                const role = row.c[1]?.v || '';
                const rights = row.c[2]?.v || '';
                const email = row.c[3]?.v || '';
                if (email) {
                    users.push({
                        name: name.trim(),
                        role: role.trim(),
                        rights: rights.trim().toUpperCase(),
                        email: email.trim().toLowerCase()
                    });
                }
            }
            return users;
        }

       async function authorizeUser(email) {
    try {
        const users = await fetchUserList();
        const user = users.find(u => u.email === email.toLowerCase().trim());
        if (user) {
            localStorage.setItem('userEmail', user.email);
            localStorage.setItem('userRole', user.rights);
            localStorage.setItem('userName', user.name);
            localStorage.setItem('userRoleText', user.role);
            localStorage.setItem('loginTime', Date.now().toString());
            return true;
        }
        return false;
    } catch (err) {
        console.error('Error fetching user list:', err);
        return false;
    }
}

        function loginWithGoogle() {
            showLoading();
            const tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: 'https://www.googleapis.com/auth/userinfo.email',
                callback: async (response) => {
                    if (response.access_token) {
                        try {
                            const userInfoResp = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                                headers: { Authorization: 'Bearer ' + response.access_token }
                            });
                            const userInfo = await userInfoResp.json();
                            const email = userInfo.email;
                            if (!email) {
                                showError('Could not retrieve email from Google. Please try again.');
                                return;
                            }
                            const authorized = await authorizeUser(email);
                            if (authorized) {
                                window.location.href = 'index.html';
                            } else {
                                showError('Access Denied: This email is not authorized. Please contact your administrator.');
                            }
                        } catch (err) {
                            console.error('Error:', err);
                            showError('An error occurred during login. Please try again.');
                        }
                    } else {
                        showError('Google sign-in was cancelled or failed. Please try again.');
                    }
                },
                error_callback: (err) => {
                    console.error('Google sign-in error:', err);
                    showError('Google sign-in failed. Please try again.');
                }
            });
            tokenClient.requestAccessToken({ prompt: 'consent' });
        }

       function checkExistingSession() {
    const email = localStorage.getItem('userEmail');
    const role = localStorage.getItem('userRole');
    const loginTime = localStorage.getItem('loginTime');
    
    if (email && role && loginTime) {
        const daysSinceLogin = (Date.now() - parseInt(loginTime, 10)) / (1000 * 60 * 60 * 24);
        if (daysSinceLogin < 7) {
            // Still within 7 days — skip login
            window.location.href = 'index.html';
        } else {
            // Expired — clear and stay on login page
            localStorage.clear();
        }
    }
}

        checkExistingSession();
        loginBtn.addEventListener('click', loginWithGoogle);
    </script>
</body>
</html>
