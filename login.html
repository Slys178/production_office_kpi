<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Staircraft</title>
    <script src="https://accounts.google.com/gsi/client"></script>
    <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0e1420;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .login-shell { width: 100%; max-width: 420px; }
        .login-card {
            background: #161d2e;
            border: 1px solid #232c42;
            border-radius: 16px;
            padding: 40px 32px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
        }
        .logo-svg { width: 44px; height: 44px; flex-shrink: 0; }
        .logo-text {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(135deg, #00A99D, #2ecc71);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .app-name {
            font-size: 0.65rem;
            font-weight: 500;
            color: #8993ab;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-left: auto;
        }
        h2 {
            color: #eef2fb;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .subheading {
            color: #8993ab;
            font-size: 0.9rem;
            margin-bottom: 28px;
        }
        .btn-google, .btn-ms {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s;
            font-family: inherit;
            margin-bottom: 12px;
        }
        .btn-google {
            background: #fff;
            color: #1a1a2e;
        }
        .btn-google:hover {
            transform: scale(1.02);
            box-shadow: 0 4px 12px rgba(255,255,255,0.1);
        }
        .btn-ms {
            background: #2f2f2f;
            color: #fff;
            border: 1px solid #5a5a5a;
        }
        .btn-ms:hover {
            transform: scale(1.02);
            background: #3a3a3a;
        }
        .btn-google:disabled, .btn-ms:disabled {
            opacity: 0.6;
            cursor: wait;
            transform: none;
        }
        .btn-google svg, .btn-ms svg { width: 20px; height: 20px; }
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            color: #8993ab;
            font-size: 0.75rem;
            margin: 8px 0 16px;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #232c42;
        }
        .error-msg {
            display: none;
            color: #e74c3c;
            background: rgba(231,76,60,0.1);
            border: 1px solid #e74c3c;
            border-radius: 8px;
            padding: 10px 14px;
            margin-top: 16px;
            font-size: 0.85rem;
        }
        .error-msg.visible { display: block; }
        .footer-note {
            color: #8993ab;
            font-size: 0.7rem;
            text-align: center;
            margin-top: 24px;
        }
        .loading-spinner {
            display: none;
            text-align: center;
            color: #8993ab;
            margin-top: 12px;
            font-size: 0.85rem;
        }
        .loading-spinner.active { display: block; }
        .loading-spinner::after {
            content: '';
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #8993ab;
            border-top: 2px solid #00A99D;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-shell">
        <div class="login-card">
            <div class="logo-area">
                <svg class="logo-svg" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="100" cy="100" r="98" fill="#00A99D"/>
                    <rect x="2" y="58" width="133" height="20" fill="white"/>
                    <rect x="58" y="2" width="20" height="133" fill="white"/>
                    <rect x="65" y="122" width="133" height="20" fill="white"/>
                    <rect x="122" y="65" width="20" height="133" fill="white"/>
                </svg>
                <span class="logo-text">STAIRCRAFT</span>
                <span class="app-name">Ops KPI</span>
            </div>

            <h2>Welcome back</h2>
            <p class="subheading">Sign in with your Staircraft Microsoft account or Google</p>

            <button type="button" id="msLoginBtn" class="btn-ms">
                <svg viewBox="0 0 21 21" aria-hidden="true">
                    <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
                    <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
                    <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
                    <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
                </svg>
                Sign in with Microsoft
            </button>

            <div class="divider">or</div>

            <button type="button" id="googleLoginBtn" class="btn-google">
                <svg viewBox="0 0 48 48">
                    <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12c0-6.627,5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24c0,11.045,8.955,20,20,20c11.045,0,20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
                    <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
                    <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
                    <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
                </svg>
                Sign in with Google
            </button>

            <div id="loadingMsg" class="loading-spinner">Verifying...</div>
            <div id="errorMsg" class="error-msg"></div>

            <p class="footer-note">🔒 Authorized users only · © 2026 Staircraft</p>
        </div>
    </div>

    <script>
        // ===== CONFIG =====
        const CLIENT_ID = '965947227076-hrls555o1pv7coftc80qng6chgtf0sh7.apps.googleusercontent.com';
        const USER_LIST_SHEET_ID = '1uX_f3jc123mX2SsK7vIVIxN_zpQ3GkUqmA9U0QdJ2Dw';
        const USER_LIST_GID = '0';

        const MSAL_CLIENT_ID = '32bb8424-b6a8-4a97-a4d1-9af7c5a5aa8c';
        const MSAL_TENANT_ID = 'd9037317-b903-4545-806c-14c523127368';

        const googleLoginBtn = document.getElementById('googleLoginBtn');
        const msLoginBtn = document.getElementById('msLoginBtn');
        const errorMsg = document.getElementById('errorMsg');
        const loadingMsg = document.getElementById('loadingMsg');

        function showError(message) {
            errorMsg.textContent = message;
            errorMsg.classList.add('visible');
            loadingMsg.classList.remove('active');
            googleLoginBtn.disabled = false;
            msLoginBtn.disabled = false;
        }
        function showLoading() {
            loadingMsg.classList.add('active');
            errorMsg.classList.remove('visible');
            googleLoginBtn.disabled = true;
            msLoginBtn.disabled = true;
        }

        function normaliseArea(raw) {
            const a = (raw || '').trim().toUpperCase().replace(/\s+/g, ' ');
            if (a === 'BOTH' || a === 'ALL' || a === 'ADMIN') return 'BOTH';
            if (a === '2ND FIX' || a === '2NDFIX' || a === '2ND' || a === 'SECOND FIX') return '2ND FIX';
            if (a === 'OFFICE' || a === '1ST' || a === '1ST FIX' || a === 'FIRST FIX' || a === 'PRODUCTION') return 'OFFICE';
            return a || 'OFFICE';
        }

        async function fetchUserList() {
            const url = `https://docs.google.com/spreadsheets/d/${USER_LIST_SHEET_ID}/gviz/tq?tqx=out:json&gid=${USER_LIST_GID}`;
            const response = await fetch(url);
            const text = await response.text();
            const json = JSON.parse(text.substring(47, text.length - 2));
            const rows = json.table.rows;
            const users = [];
            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                if (!row.c || row.c.length < 4) continue;
                const name = row.c[0]?.v || '';
                const role = row.c[1]?.v || '';
                const rights = row.c[2]?.v || '';
                const email = row.c[3]?.v || '';
                const area = row.c[4]?.v || '';
                if (email) {
                    users.push({
                        name: name.trim(),
                        role: role.trim(),
                        rights: rights.trim().toUpperCase(),
                        email: email.trim().toLowerCase(),
                        area: normaliseArea(area)
                    });
                }
            }
            return users;
        }

        async function authorizeUser(email) {
            try {
                const users = await fetchUserList();
                const user = users.find(u => u.email === email.toLowerCase().trim());
                if (user) {
                    localStorage.setItem('userEmail', user.email);
                    localStorage.setItem('userRole', user.rights);
                    localStorage.setItem('userName', user.name);
                    localStorage.setItem('userRoleText', user.role);
                    localStorage.setItem('userArea', user.area);
                    localStorage.setItem('loginTime', Date.now().toString());
                    return true;
                }
                return false;
            } catch (err) {
                console.error('Error fetching user list:', err);
                return false;
            }
        }

        async function finishLoginWithEmail(email) {
            if (!email) {
                showError('Could not retrieve email from sign-in. Please try again.');
                return;
            }
            const authorized = await authorizeUser(email);
            if (authorized) {
                window.location.href = 'index.html';
            } else {
                showError('Access Denied: ' + email + ' is not on the authorised users sheet. Ask an admin to add this email.');
            }
        }

        function loginWithGoogle() {
            showLoading();
            const tokenClient = google.accounts.oauth2.initTokenClient({
                client_id: CLIENT_ID,
                scope: 'https://www.googleapis.com/auth/userinfo.email',
                callback: async (response) => {
                    if (response.access_token) {
                        try {
                            const userInfoResp = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
                                headers: { Authorization: 'Bearer ' + response.access_token }
                            });
                            const userInfo = await userInfoResp.json();
                            await finishLoginWithEmail(userInfo.email);
                        } catch (err) {
                            console.error('Error:', err);
                            showError('An error occurred during Google login. Please try again.');
                        }
                    } else {
                        showError('Google sign-in was cancelled or failed. Please try again.');
                    }
                },
                error_callback: (err) => {
                    console.error('Google sign-in error:', err);
                    showError('Google sign-in failed. Please try again.');
                }
            });
            tokenClient.requestAccessToken({ prompt: 'consent' });
        }

        function getMsalApi() {
            if (typeof msal !== 'undefined') return msal;
            if (typeof window !== 'undefined' && window.msal) return window.msal;
            return null;
        }

        function msalConfigured() {
            return MSAL_CLIENT_ID &&
                MSAL_TENANT_ID &&
                MSAL_CLIENT_ID.indexOf('REPLACE_') !== 0 &&
                MSAL_TENANT_ID.indexOf('REPLACE_') !== 0;
        }

        let msalInstance = null;

        function getMsalInstance() {
            if (!msalConfigured()) return null;
            if (msalInstance) return msalInstance;
            const api = getMsalApi();
            if (!api || !api.PublicClientApplication) return null;
            const msalConfig = {
                auth: {
                    clientId: MSAL_CLIENT_ID,
                    authority: 'https://login.microsoftonline.com/' + MSAL_TENANT_ID,
                    redirectUri: window.location.origin + '/login.html',
                    postLogoutRedirectUri: window.location.origin + '/login.html',
                    navigateToLoginRequestUrl: false
                },
                cache: {
                    cacheLocation: 'localStorage',
                    storeAuthStateInCookie: false
                }
            };
            msalInstance = new api.PublicClientApplication(msalConfig);
            return msalInstance;
        }

        async function loginWithMicrosoft() {
            if (!msalConfigured()) {
                showError('Microsoft login is not configured yet.');
                return;
            }
            if (!getMsalApi()) {
                showError('Microsoft login library failed to load. Try hard-refresh (Ctrl+F5) or use Google sign-in for now.');
                return;
            }
            showLoading();
            try {
                const instance = getMsalInstance();
                if (!instance) {
                    showError('Could not start Microsoft login.');
                    return;
                }
                await instance.initialize();

                const loginRequest = {
                    scopes: ['openid', 'profile', 'email', 'User.Read']
                };

                const result = await instance.loginPopup(loginRequest);
                const account = result.account;
                let email =
                    (account && (account.username || account.mail)) ||
                    (result.idTokenClaims && (result.idTokenClaims.preferred_username || result.idTokenClaims.email)) ||
                    '';

                if (!email && account) {
                    try {
                        const token = await instance.acquireTokenSilent({
                            scopes: ['User.Read'],
                            account: account
                        });
                        const me = await fetch('https://graph.microsoft.com/v1.0/me',
                            { headers: { Authorization: 'Bearer ' + token.accessToken } });
                        if (me.ok) {
                            const profile = await me.json();
                            email = profile.mail || profile.userPrincipalName || '';
                        }
                    } catch (graphErr) {
                        console.warn('Graph profile lookup failed', graphErr);
                    }
                }

                await finishLoginWithEmail(email);
            } catch (err) {
                console.error('Microsoft sign-in error:', err);
                const msg = (err && (err.message || err.errorMessage)) || String(err);
                if (/user_cancelled|popup_window_closed|access_denied/i.test(msg)) {
                    showError('Microsoft sign-in was cancelled.');
                } else {
                    showError('Microsoft sign-in failed: ' + msg);
                }
            }
        }

        function checkExistingSession() {
            const email = localStorage.getItem('userEmail');
            const role = localStorage.getItem('userRole');
            const loginTime = localStorage.getItem('loginTime');

            if (email && role && loginTime) {
                const daysSinceLogin = (Date.now() - parseInt(loginTime, 10)) / (1000 * 60 * 60 * 24);
                if (daysSinceLogin < 7) {
                    window.location.href = 'index.html';
                } else {
                    localStorage.clear();
                }
            }
        }

        checkExistingSession();
        googleLoginBtn.addEventListener('click', loginWithGoogle);
        msLoginBtn.addEventListener('click', loginWithMicrosoft);
    </script>
</body>
</html>
